name: Update GitHub Actions Dependencies

on:
  schedule:
    - cron: "0 0 * * 1"  # Runs every Monday
  workflow_dispatch:      # Manual trigger option

jobs:
  update-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # Required to modify repository contents
      pull-requests: write    # Required to create PRs
      actions: read           # Required to read workflow files

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Update GitHub Actions
        uses: ThreatFlux/githubWorkFlowChecker@26a6118d69047c9ddf3386e9216b423ee9b2e9ee  # v1.20250813.1
        with:
          owner: ${{ github.repository_owner }}
          repo-name: ${{ github.event.repository.name }}
          labels: "dependencies,security"
          token: ${{ secrets.GIT_TOKEN }}
