name: Dependency Vulnerability Scan
on: push

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          # Nothing after the checkout talks to git, and the audit step runs a
          # third-party composite action in this same workspace.
          persist-credentials: false

      # `make install` / `make dev-setup` install from pyproject.toml, not from
      # requirements*.txt, so the two sets drift (pytest-asyncio, coverage and
      # wheel only exist in the `dev` extra). pip-audit's project mode reads
      # `[project].dependencies` only, so render the extras out too and audit
      # the result as an ordinary requirements file.
      - name: Derive requirements from pyproject.toml
        run: |
          python3 - <<'PY' > "${RUNNER_TEMP}/pyproject-requirements.txt"
          import tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]

          requirements = list(project.get("dependencies", []))
          for extra in project.get("optional-dependencies", {}).values():
              requirements.extend(extra)

          print("\n".join(sorted(set(requirements))))
          PY

      - name: Run pip-audit to check for vulnerabilities
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: >-
            requirements.txt
            requirements-dev.txt
            ${{ runner.temp }}/pyproject-requirements.txt
          # GHSA-wj6h-64fc-37mp (aka CVE-2024-23342 / PYSEC-2026-1325): Minerva timing
          # attack on P-256 in python-ecdsa. `ecdsa` is a hard transitive dependency of
          # python-jose (`ecdsa!=0.15`), every published version is affected, and upstream
          # has declared side-channel attacks out of scope with no planned fix -- so there
          # is no version to upgrade to. YaraFlux signs JWTs with HS256 (symmetric, see
          # config.JWT_ALGORITHM) through the `cryptography` backend and never calls the
          # affected ECDSA APIs. Drop this ignore if a fixed `ecdsa` release ever ships,
          # if python-jose stops requiring it, or if JWT_ALGORITHM moves to an EC curve.
          ignore-vulns: GHSA-wj6h-64fc-37mp
