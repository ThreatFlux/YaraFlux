name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]
        docker-stage: [builder, development, production]

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: make install

    - name: Instal dev dependencies
      run: make dev-setup

    - name: Format code
      run: make format

    - name: Run linting
      run: make lint

    - name: Run coverage
      run: |
        make coverage

    - name: Build Docker stage
      run: |
        make docker-build

    - name: Test Docker stage
      run: |
        # Test production stage health check
        make docker-test
    - name: Upload coverage reports
      uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de  # v5.5.2
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
      with:
        name: test-results-py${{ matrix.python-version }}-${{ matrix.docker-stage }}
        path: |
          htmlcov/**/*
          !htmlcov/**/*.pyc
          !htmlcov/**/__pycache__
          .coverage
        retention-days: 30
        if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: make install

      - name: Install dev dependencies
        run: make dev-setup
      
      - name: Run security checks
        run: make security-check
